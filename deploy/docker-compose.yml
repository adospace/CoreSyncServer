services:
  coresyncserver:
    image: coresyncserver:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: coresyncserver
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=CoreSyncServer;Username=coresync;Password=${POSTGRES_PASSWORD:-ChangeMeNow!}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coresync

  postgres:
    image: postgres:17
    container_name: coresyncserver-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=coresync
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ChangeMeNow!}
      - POSTGRES_DB=CoreSyncServer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coresync -d CoreSyncServer"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - coresync

volumes:
  pgdata:

networks:
  coresync:
